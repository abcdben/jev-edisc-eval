# TREC 2016 Total Recall track, "athome4" (Jeb Bush gubernatorial email, 290,099 messages).
# Twelve of the 34 official topics. `rfp_text` is the official NIST topic description verbatim.
# Gold = NIST assessor judgments (rel 1 or 2); unjudged = not responsive, per TREC convention.
#
# criteria_version: v1
# v0 (design/trec/criteria_v0.yaml): criteria written from the official sentence alone.
# v1: revised after one calibration round on data/trec/dev.jsonl (686 emails, never evaluated on):
#     Jev and Gemini Flash-Lite run with v0, shared misses and false alarms read per topic.
#     The recurring finding is that NIST assessors judged at the level of the underlying *issue*
#     (its background, adjacent policy fights, and aftermath), not the sentence. Each topic's criteria
#     now describe that scope. Per-topic changes are noted inline; dev numbers per version are in
#     design/trec/calibration.md. The official `rfp_text` is unchanged.

name: trec
kind: binary
positive_label: responsive
negative_label: not_responsive

context: |
  Matter: a public-records request against the Executive Office of the Governor of Florida, covering email sent
  or received by Governor Jeb Bush and his staff during his two terms (1999-2007). The collection is government
  email: constituent letters, staff correspondence, press clippings and news forwards, scheduling, legislation
  and budget traffic, agency reports, and personal messages. Emails are shown with their headers, as a reviewer
  would see them; quoted earlier messages and forwarded articles are part of the document.

  Each request names an issue. The requesting party reads every request at the level of the issue, not the
  sentence: an email is responsive if it substantively concerns the issue, its background, the policy fights and
  legislation around it, or its consequences in Florida, even when the request's exact words never appear. A
  constituent asking the Governor to sign or veto a bill on the issue is responsive. A passing use of a word
  from the request, with no substantive connection to the issue, is not. Note that "Governor Bush" and "Jeb" in
  these emails refer to Jeb Bush, the Governor of Florida, not to his brother the President.

gate_question: |
  Does this email have substantive content about a matter of Florida state government or public policy (as
  opposed to a bare scheduling note, a greeting or thank-you with no subject matter, an empty forward, an
  auto-reply, spam, or a purely personal message)?

questions:

  gw_bush:
    title: George W. Bush
    # v1: sharpened the Jeb/George distinction; added campaigns, federal-Florida dealings, family.
    rfp_text: |
      All documents concerning George W. Bush, whether by explicit reference or by his relationship to Governor Bush.
    literal: |
      Does this email concern George W. Bush, either by explicit reference to him or through his relationship to
      Governor Jeb Bush?
    positive_desc: |
      The email concerns George W. Bush, the President (2001-2009), Texas governor, and presidential candidate, and
      Governor Jeb Bush's brother: references to him by name or as "the President" or "your brother"; his
      campaigns, administration, appointments, or policies; White House or federal dealings with Florida in which
      he figures; requests that the Governor pass something on to him; and Bush family matters that involve him.
    negative_desc: |
      The email does not concern George W. Bush. Emails addressed to or about Governor Jeb Bush alone, complaints
      or praise directed at the Governor, other Bush family members, and federal agencies or matters with no
      reference to the President are not responsive, even though they mention "Bush".
    structured:
      responsive:
        what: Content concerning George W. Bush, explicitly or via his relationship to Governor Jeb Bush
        includes: [George W. Bush by name or as the President or candidate, your brother or the President when addressed to the Governor, his 2000 or 2004 campaigns, his administration's policies or appointments, White House dealings with Florida involving him, Bush family events involving him]
      not_responsive:
        what: No connection to George W. Bush
        includes: [Governor Jeb Bush alone, letters praising or attacking the Governor, other Bush family members, federal agencies with no reference to the President, unrelated state business]
    subparts:
      - Does this email refer to George W. Bush explicitly, by name, as the President or candidate, or as the Governor's brother?
      - Does this email concern George W. Bush through his relationship to Governor Jeb Bush (his administration's dealings with Florida, his campaigns in Florida, family matters)?

  movie_gallery:
    title: Movie Gallery
    # v1: unchanged in substance (dev F1 ~89 for both models).
    rfp_text: |
      All documents concerning investments or divestments by the State of Florida in Movie Gallery.
    literal: |
      Does this email concern investments or divestments by the State of Florida in Movie Gallery?
    positive_desc: |
      The email concerns the State of Florida (its pension fund, the State Board of Administration, or any other
      state investment vehicle) investing in, holding, or divesting from Movie Gallery, the video rental company,
      including criticism of or explanations for the state's Movie Gallery position.
    negative_desc: |
      The email does not concern Florida's investment in or divestment from Movie Gallery. Other state investments,
      the film industry, movie rentals generally, and Movie Gallery as a business with no state-investment angle
      are not responsive.
    structured:
      responsive:
        what: Florida state investment or divestment in Movie Gallery
        includes: [State Board of Administration or pension fund holdings in Movie Gallery, buying or selling Movie Gallery stock or bonds, criticism or defense of the state's Movie Gallery position]
      not_responsive:
        what: No Florida investment in Movie Gallery
        includes: [other state investments, the film industry, video rental generally, Movie Gallery stores without an investment angle]
    subparts:
      - Does this email concern the State of Florida investing in or holding a position in Movie Gallery?
      - Does this email concern the State of Florida divesting or selling its position in Movie Gallery, or criticism of the state's Movie Gallery investment?

  rilya_wilson:
    title: Lost foster child Rilya Wilson
    # v1: gold reads "impact or aftermath" as the whole child-welfare crisis the case exposed. Broadened to
    #     DCF foster care, children lost or harmed in state care, DCF leadership and privatization, adoption.
    rfp_text: |
      All documents concerning the disappearance of lost foster child, Rilya Wilson, and the impact or aftermath
      in Florida resulting from the loss.
    literal: |
      Does this email concern the disappearance of foster child Rilya Wilson, or the impact or aftermath in
      Florida resulting from her loss?
    positive_desc: |
      The email concerns Rilya Wilson, the foster child whose disappearance from Florida's child-welfare system was
      discovered in 2002, or the crisis in Florida's child-welfare system that her case exposed and the response to
      it: the Department of Children and Families (DCF) and its handling of children in state care; children lost,
      missing, abused, or neglected while under DCF supervision; DCF leadership, resignations, investigations, and
      hearings; foster care, adoption, and child-protection reforms, including privatization or community-based
      care; and constituents' complaints or pleas about DCF's handling of particular children and families.
    negative_desc: |
      The email does not concern Rilya Wilson or Florida's child-welfare system. Juvenile justice, education,
      health, and family matters with no connection to DCF's care or protection of children are not responsive.
    structured:
      responsive:
        what: Rilya Wilson's disappearance and the Florida child-welfare crisis and response around it
        includes: [Rilya Wilson by name, children missing or harmed in DCF care, DCF leadership resignations investigations or hearings, foster care and adoption reforms, DCF privatization or community-based care, constituent complaints about DCF handling of children, missing-children legislation]
      not_responsive:
        what: No connection to the Rilya Wilson case or Florida's child-welfare system
        includes: [juvenile justice, schools, general health care, family matters with no DCF involvement, missing adults]
    subparts:
      - Does this email concern Rilya Wilson or her disappearance?
      - Does this email concern Florida's child-welfare system in the aftermath of that loss, including DCF's care of children, children lost or harmed in state care, DCF leadership or reforms, foster care or adoption, or a constituent's complaint about DCF's handling of a child?

  faith_based:
    title: Faith-based initiatives
    # v1: added faith-based partnerships with the Governor's office, pastors and churches as service providers,
    #     the Governor's Faith-Based Advisory Board; recall was already ~75-78 on dev.
    rfp_text: |
      All documents concerning grants or other initiatives in Florida to offload social services to so-called
      faith-based agencies. Services include but are not limited to education, prisons, and emergency relief.
    literal: |
      Does this email concern grants or other initiatives in Florida to have social services (such as education,
      prisons, or emergency relief) provided by faith-based agencies?
    positive_desc: |
      The email concerns Florida grants, programs, partnerships, legislation, boards, or other initiatives that
      have social services delivered by faith-based or religious organizations: education and schools, prisons
      and prisoner re-entry, emergency relief, welfare, youth and family services, mentoring, substance abuse,
      and similar services; the Governor's faith-based and community initiatives; and churches, pastors, or
      religious charities as partners or providers of such services.
    negative_desc: |
      The email does not concern faith-based delivery of social services in Florida. Religious matters with no
      social-service program (prayers, greetings, church events), and social services delivered by secular or
      government agencies with no faith-based angle, are not responsive.
    structured:
      responsive:
        what: Florida initiatives shifting social services to faith-based agencies
        includes: [faith-based grants or funding, faith-based prisons or re-entry programs, faith-based education or school programs, faith-based emergency relief or welfare, mentoring or youth programs run by churches, the Governor's faith-based and community initiatives or advisory board, pastors or churches as service partners]
      not_responsive:
        what: No faith-based social-service initiative
        includes: [religion or church matters without a service program, secular social services, prayers or greetings, general education or prison policy without a faith-based angle]
    subparts:
      - Does this email concern grants or funding for faith-based agencies to provide social services in Florida?
      - Does this email concern any other Florida initiative, program, partnership, or policy to have social services delivered by faith-based or religious organizations?

  marketing:
    title: Marketing
    # v1: gold treats promotion of Florida broadly as marketing: tourism (Visit Florida), economic development
    #     and business recruitment (Enterprise Florida, Team Florida), trade and international relations for
    #     promotion, the Governor's outreach and communications (webcasts, addresses). Broadened accordingly.
    rfp_text: |
      All documents concerning advertising or marketing efforts undertaken by the Florida Governor's office or any
      other institution of the State of Florida.
    literal: |
      Does this email concern advertising or marketing efforts undertaken by the Florida Governor's office or any
      other institution of the State of Florida?
    positive_desc: |
      The email concerns efforts by the Governor's office or any Florida state agency, board, university, or
      state-sponsored organization to advertise, market, or promote Florida, a state program, or the Governor's
      message: advertising campaigns and public-service announcements; tourism promotion (Visit Florida, film
      commission); economic development, business recruitment, and trade promotion (Enterprise Florida, trade
      missions, meetings with foreign officials to promote Florida business); branding, slogans, and websites;
      the Governor's public outreach such as webcasts, addresses, and communications campaigns; and the funding,
      contracts, or evaluation of such efforts.
    negative_desc: |
      The email does not concern state advertising, marketing, or promotion. Marketing by private companies,
      unsolicited marketing received by staff, political campaign advertising by non-state entities, and routine
      press inquiries or scheduling with no promotional effort are not responsive.
    structured:
      responsive:
        what: Advertising, marketing, or promotion by the Governor's office or a Florida state institution
        includes: [state ad campaigns or PSAs, Visit Florida or tourism promotion, Enterprise Florida or economic development and business recruitment, trade missions or foreign-relations for Florida business, branding slogans or websites, the Governor's webcasts addresses or communications campaigns, advertising budgets or contracts]
      not_responsive:
        what: No state advertising, marketing, or promotion effort
        includes: [private company marketing, political campaign advertising, unsolicited marketing received by staff, routine press inquiries, scheduling with no promotional purpose]
    subparts:
      - Does this email concern advertising, marketing, or public outreach undertaken by the Florida Governor's office?
      - Does this email concern promotion of Florida (tourism, economic development, business recruitment, trade) or of a state program by any Florida state institution?

  recount_2000:
    title: 2000 recount
    # v1: gold extends to Florida election administration and reform in the wake of 2000: the 2001 election
    #     reform act and voting equipment, supervisors of elections (Broward's Miriam Oliphant), Katherine
    #     Harris, absentee ballots, the felon purge list and felon rights restoration, election-ethics fights.
    rfp_text: |
      All documents concerning the contested result of the 2000 presidential election.
    literal: |
      Does this email concern the contested result of the 2000 presidential election?
    positive_desc: |
      The email concerns the contested outcome of the 2000 presidential election or its aftermath in Florida: the
      recount, ballot disputes, certification, litigation (Bush v. Gore), the Electoral College dispute; and the
      election-administration controversies and reforms that followed, including the 2001 election reform law and
      voting equipment, the conduct or removal of county supervisors of elections, Secretary of State Katherine
      Harris and her successors, absentee-ballot rules, the felon purge list and restoration of felons' voting
      rights, and disputes over election fairness or ethics in later Florida elections.
    negative_desc: |
      The email does not concern the contested 2000 presidential result or Florida's election-administration
      aftermath. General political commentary, campaigns and candidates with no election-administration angle, and
      appointments or ethics matters unrelated to elections are not responsive.
    structured:
      responsive:
        what: The contested 2000 presidential result and Florida's election-administration aftermath
        includes: [Florida recount and ballot disputes, Bush v. Gore and certification, 2001 election reform and voting machines, county supervisors of elections conduct or removal, Katherine Harris, absentee ballot rules, felon purge list or felon voting rights, election fairness or ethics disputes in later Florida elections]
      not_responsive:
        what: No connection to the 2000 dispute or election administration
        includes: [general political commentary, candidates and campaigns without an administration angle, non-election appointments or ethics matters]
    subparts:
      - Does this email concern the Florida recount, ballot disputes, certification, or litigation over the 2000 presidential election result?
      - Does this email concern Florida election administration or reform in the aftermath of 2000 (election reform law, voting equipment, supervisors of elections, absentee ballots, felon voting rights, election fairness disputes)?

  condominiums:
    title: Condominiums
    # v1: added homeowners' associations and community-association legislation (the Cyber Citizens for
    #     Justice traffic), association-reform bills and sign/veto requests on them.
    rfp_text: |
      All documents concerning the rules and organizations governing Florida condominium associations and
      conflicts between owners and managers in Florida. Relevant documents include those concerning the
      establishment of the Florida office of ombudsman, and issues relating to hiring and firing the ombudsman.
    literal: |
      Does this email concern the rules and organizations governing Florida condominium associations, conflicts
      between condominium owners and managers in Florida, the establishment of the Florida condominium ombudsman
      office, or the hiring or firing of the ombudsman?
    positive_desc: |
      The email concerns Florida condominium and community associations: the statutes, rules, and agencies that
      govern condominium and homeowners' associations; disputes between unit owners and association boards or
      managers; association-reform legislation and requests to sign or veto it; consumer advocacy about
      associations (for example Cyber Citizens for Justice); and the Florida condominium ombudsman, including
      creating the office and appointing, hiring, or firing the ombudsman.
    negative_desc: |
      The email does not concern condominium or homeowners' association governance, owner-manager conflicts, or
      the ombudsman. Real estate sales, housing supply, hurricane insurance, and construction matters with no
      association-governance angle are not responsive.
    structured:
      responsive:
        what: Florida condominium and homeowners' association governance, owner-board conflicts, and the condominium ombudsman
        includes: [condominium or HOA statutes and rules, association boards and management disputes, owner complaints against associations, association-reform bills and sign or veto requests, Cyber Citizens for Justice, the condominium ombudsman office, hiring or firing the ombudsman]
      not_responsive:
        what: No association-governance angle
        includes: [general housing or real estate, homeowner insurance, construction, condominium sales with no governance issue]
    subparts:
      - Does this email concern the rules or organizations governing Florida condominium or homeowners' associations, or conflicts between owners and boards or managers?
      - Does this email concern the Florida condominium ombudsman (establishing the office, or hiring or firing the ombudsman)?

  bottled_water:
    title: Bottled water
    # v1: gold includes springs and groundwater protection generally (minimum flows, consumptive-use permits,
    #     the Springs Initiative), not only bottlers. Broadened accordingly.
    rfp_text: |
      All documents concerning the extraction of water in Florida for bottling by commercial enterprises.
    literal: |
      Does this email concern the extraction of water in Florida for bottling by commercial enterprises?
    positive_desc: |
      The email concerns commercial extraction of Florida water for bottling, or the protection of the springs and
      groundwater from which it is drawn: bottling companies and their withdrawals; water-use or consumptive-use
      permits for pumping spring or aquifer water; minimum flows and levels for springs; the Springs Initiative and
      Springs Task Force; opposition to pumping or bottling operations; and legislation, fees, or taxes on water
      extraction or bottled water.
    negative_desc: |
      The email does not concern water extraction for bottling or the protection of Florida's springs and
      groundwater from withdrawal. Drinking-water quality, drought and water supply for cities, Everglades
      restoration, coastal or surface-water pollution, and bottled water bought or distributed are not responsive.
    structured:
      responsive:
        what: Commercial extraction of Florida water for bottling, and protection of springs and groundwater from withdrawal
        includes: [bottling companies and spring water withdrawals, consumptive-use or water-use permits for pumping, minimum flows and levels for springs, Springs Initiative or Springs Task Force, opposition to pumping or bottling operations, legislation fees or taxes on water extraction or bottled water]
      not_responsive:
        what: No extraction or springs-protection angle
        includes: [drinking-water quality, municipal water supply or drought, Everglades restoration, surface-water pollution, bottled water bought or distributed]
    subparts:
      - Does this email concern a commercial enterprise extracting or withdrawing water in Florida for bottling?
      - Does this email concern permits, minimum flows, legislation, or opposition regarding the withdrawal of water from Florida's springs or aquifer?

  medicaid_reform:
    title: Medicaid reform
    # v1: gold covers Medicaid policy and program change broadly (waivers, federal Medicaid financing and NGA
    #     letters, cuts, program leadership, nursing home and pharmacy programs), not only the 2005 reform bill.
    rfp_text: |
      All documents concerning efforts to reform Medicaid.
    literal: |
      Does this email concern efforts to reform Medicaid?
    positive_desc: |
      The email concerns efforts to change the Medicaid program, in Florida or nationally: reform proposals,
      white papers, and legislation (including Florida's 2005-2006 Medicaid reform and managed-care pilots);
      waivers and pilot programs; federal Medicaid financing and flexibility, including governors' (NGA) letters
      and negotiations with Congress or HHS; cost containment, cuts, and spending-growth debates; changes to
      Medicaid pharmacy, nursing-home, or disease-management programs; Medicaid leadership and hearings; and
      advocacy or press about reforming Medicaid.
    negative_desc: |
      The email does not concern changing the Medicaid program. Individual eligibility or claims, routine provider
      payments with no policy change, and other health programs (Medicare, KidCare, general health care) with no
      Medicaid-reform angle are not responsive.
    structured:
      responsive:
        what: Efforts to reform or restructure Medicaid
        includes: [Medicaid reform proposals white papers or legislation, waivers or pilot programs, managed care or empowered care restructuring, federal Medicaid financing or NGA letters, Medicaid cuts or cost containment, pharmacy or nursing home or disease management program changes, Medicaid leadership and hearings]
      not_responsive:
        what: No Medicaid change content
        includes: [individual eligibility or claims, routine provider payments, Medicare or KidCare or general health care, budget matters without a Medicaid change]
    subparts:
      - Does this email concern a proposal, plan, waiver, pilot, or legislation to reform or restructure Medicaid?
      - Does this email concern Medicaid financing, cuts, program changes, leadership, or debate about changing how Medicaid works?

  eminent_domain:
    title: Eminent domain
    # v1: gold covers government acquisition or taking of private land and property-rights fights broadly:
    #     Kelo, eminent domain bills, state land acquisition (CARL, Florida Forever, Everglades), billboard
    #     removal compensation. Broadened accordingly.
    rfp_text: |
      All documents concerning the legality or morality of expropriating land in Florida for commercial development.
    literal: |
      Does this email concern the legality or morality of expropriating land in Florida for commercial development?
    positive_desc: |
      The email concerns government taking or acquisition of private land in Florida and the property-rights
      questions it raises: eminent domain for private or commercial development, the Kelo decision and Florida's
      response (legislation, constitutional amendment); state or local acquisition of private land for
      conservation or public purposes (CARL, Florida Forever, Everglades land buying) and disputes over such
      purchases; compensation for regulatory takings, including billboard-removal compensation; and debate over
      whether such takings are legal or fair.
    negative_desc: |
      The email does not concern government taking or acquisition of private land or property-rights disputes.
      Zoning and growth management without a taking, ordinary road projects, environmental restoration with no land
      acquisition, and property taxes are not responsive.
    structured:
      responsive:
        what: Government taking or acquisition of private land in Florida and the property-rights debate around it
        includes: [Kelo and Florida's response, eminent domain bills or amendments, takings for private or commercial development, CARL or Florida Forever or Everglades land acquisition, disputes over state land purchases, billboard removal compensation, regulatory takings and property-rights legislation]
      not_responsive:
        what: No taking or acquisition of private land
        includes: [zoning or growth management without a taking, road projects, environmental restoration with no land purchase, property tax]
    subparts:
      - Does this email concern the legality or fairness of expropriating private land in Florida (eminent domain, Kelo, takings legislation or amendments)?
      - Does this email concern government acquisition of private land in Florida (state land-buying programs, Everglades land acquisition, billboard or regulatory-takings compensation)?

  nra_rifle:
    title: National Rifle Association (NRA)
    pair: nra
    # v1: gold treats gun-rights legislation and advocacy in Florida as within the NRA's "influences":
    #     concealed-weapons and gun-show bills, firearms manufacturers, gun-rights constituents. Broadened.
    #     Gold also marks ~34 non-resident-alien banking letters relevant, contrary to the topic text; those
    #     are flagged gray in the corpus and the criteria keep the official exclusion.
    rfp_text: |
      All documents concerning the National Rifle Association, its members, and its influences. Documents
      concerning the non-resident alien issue are not relevant.
    literal: |
      Does this email concern the National Rifle Association, its members, or its influence? Documents about the
      non-resident alien issue (also abbreviated NRA) are not responsive.
    positive_desc: |
      The email concerns the National Rifle Association or the gun-rights agenda it advances in Florida: the
      organization, its officials, members, lobbying, endorsements, and mailings; firearms legislation and
      ordinances (concealed weapons, gun shows, background checks, firearms in workplaces or facilities) and
      constituents' positions on them; gun-rights advocacy directed at the Governor; and firearms industry or
      manufacturer matters raised with the state.
    negative_desc: |
      The email does not concern the National Rifle Association or gun-rights matters. Emails in which "NRA" means
      non-resident alien (bank interest reporting, IRS rules, immigration) are not responsive, nor are hunting or
      wildlife matters with no firearms-policy angle, or law-enforcement matters with no gun-rights dimension.
    structured:
      responsive:
        what: The National Rifle Association, its members, and its influence, including gun-rights legislation and advocacy
        includes: [NRA the gun-rights organization, NRA lobbying endorsements or mailings, NRA members or officials, concealed-weapons or gun-show or firearms bills, constituent positions on firearms legislation, gun-rights advocacy to the Governor, firearms manufacturers or industry]
      not_responsive:
        what: Not about the National Rifle Association or gun rights
        includes: [NRA meaning non-resident alien, IRS or bank interest reporting, hunting or wildlife without a firearms-policy angle, law enforcement without a gun-rights dimension]
    subparts:
      - Does this email concern the National Rifle Association as an organization, or its members, lobbying, or endorsements?
      - Does this email concern firearms legislation, gun-rights advocacy, or the firearms industry in Florida (the NRA's sphere of influence)?

  nra_aliens:
    title: Non-resident aliens (NRA)
    pair: nra
    # v1: named the actual issue in the collection: the proposed IRS rule requiring banks to report interest
    #     paid on non-resident aliens' deposits, opposed by Florida bankers and the Governor.
    rfp_text: |
      All documents involving discussions of the non-resident alien issue. Documents concerning the National
      Rifle Association are not relevant.
    literal: |
      Does this email involve discussion of the non-resident alien issue? Documents about the National Rifle
      Association (also abbreviated NRA) are not responsive.
    positive_desc: |
      The email involves discussion of the non-resident alien (NRA) issue: chiefly the proposed IRS or Treasury
      regulation requiring U.S. banks to report interest paid on deposits held by non-resident aliens, the
      Florida Bankers Association's and the Governor's opposition to it, and letters to Treasury, the IRS, or
      Congress about it; and more generally the treatment of non-resident aliens under tax, banking, licensing,
      tuition, or benefits law.
    negative_desc: |
      The email does not discuss the non-resident alien issue. Emails in which "NRA" means the National Rifle
      Association, and immigration or visa matters that do not concern non-resident alien status under tax or
      similar law, are not responsive.
    structured:
      responsive:
        what: Discussion of the non-resident alien issue
        includes: [IRS or Treasury rule on reporting interest paid to non-resident aliens, Florida Bankers Association opposition, letters to Treasury IRS or Congress on the NRA rule, deposits or capital flight of non-resident aliens, tax or licensing or benefits treatment of non-resident aliens]
      not_responsive:
        what: Not about non-resident aliens
        includes: [NRA meaning National Rifle Association, general immigration or visa matters, foreign trade or travel]
    subparts:
      - Does this email discuss the IRS or Treasury proposal to report interest paid on non-resident aliens' bank deposits, or opposition to it?
      - Does this email discuss the status or treatment of non-resident aliens under tax, banking, licensing, or other law or policy?
