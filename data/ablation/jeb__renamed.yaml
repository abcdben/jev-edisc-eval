# Generated by `bench ablation2-build`: the TREC task set with the Governor and the public figures renamed (jeb_names.py).
name: trec__renamed
kind: binary
positive_label: responsive
negative_label: not_responsive
context: 'Matter: a public-records request against the Executive Office of the Governor of Florida, covering email sent

  or received by Governor Cal Weston and his staff during his two terms. The collection is government

  email: constituent letters, staff correspondence, press clippings and news forwards, scheduling, legislation

  and budget traffic, agency reports, and personal messages. Emails are shown with their headers, as a reviewer

  would see them; quoted earlier messages and forwarded articles are part of the document.


  Each request names an issue. The requesting party reads every request at the level of the issue, not the

  sentence: an email is responsive if it substantively concerns the issue, its background, the policy fights and

  legislation around it, or its consequences in Florida, even when the request''s exact words never appear. A

  constituent asking the Governor to sign or veto a bill on the issue is responsive. A passing use of a word

  from the request, with no substantive connection to the issue, is not. Note that "Governor Weston" and "Cal" in

  these emails refer to Cal Weston, the Governor of Florida, not to his brother the President.'
gate_question: 'Does this email have substantive content about a matter of Florida state government or public policy (as

  opposed to a bare scheduling note, a greeting or thank-you with no subject matter, an empty forward, an

  auto-reply, spam, or a purely personal message)?'
questions:
  recount_2000:
    title: 2000 recount
    rfp_text: All documents concerning the contested result of the 2000 presidential election.
    positive_desc: 'The email concerns the contested outcome of the 2000 presidential election or its aftermath in Florida:
      the

      recount, ballot disputes, certification, litigation (Weston v. Hartwell), the Electoral College dispute; and the

      election-administration controversies and reforms that followed, including the 2001 election reform law and

      voting equipment, the conduct or removal of county supervisors of elections, Secretary of State Katherine Ashcombe and
      her successors, absentee-ballot rules, the felon purge list and restoration of felons'' voting

      rights, and disputes over election fairness or ethics in later Florida elections.'
    negative_desc: 'The email does not concern the contested 2000 presidential result or Florida''s election-administration

      aftermath. General political commentary, campaigns and candidates with no election-administration angle, and

      appointments or ethics matters unrelated to elections are not responsive.'
    literal: Does this email concern the contested result of the 2000 presidential election?
  rilya_wilson:
    title: Lost foster child Kiara Thornley
    rfp_text: 'All documents concerning the disappearance of lost foster child, Kiara Thornley, and the impact or aftermath

      in Florida resulting from the loss.'
    positive_desc: 'The email concerns Kiara Thornley, the foster child whose disappearance from Florida''s child-welfare
      system was

      discovered in 2002, or the crisis in Florida''s child-welfare system that her case exposed and the response to

      it: the Department of Children and Families (DCF) and its handling of children in state care; children lost,

      missing, abused, or neglected while under DCF supervision; DCF leadership, resignations, investigations, and

      hearings; foster care, adoption, and child-protection reforms, including privatization or community-based

      care; and constituents'' complaints or pleas about DCF''s handling of particular children and families.'
    negative_desc: 'The email does not concern Kiara Thornley or Florida''s child-welfare system. Juvenile justice, education,

      health, and family matters with no connection to DCF''s care or protection of children are not responsive.'
    literal: 'Does this email concern the disappearance of foster child Kiara Thornley, or the impact or aftermath in

      Florida resulting from her loss?'
  medicaid_reform:
    title: Medicaid reform
    rfp_text: All documents concerning efforts to reform Medicaid.
    positive_desc: 'The email concerns efforts to change the Medicaid program, in Florida or nationally: reform proposals,

      white papers, and legislation (including Florida''s 2005-2006 Medicaid reform and managed-care pilots);

      waivers and pilot programs; federal Medicaid financing and flexibility, including governors'' (NGA) letters

      and negotiations with Congress or HHS; cost containment, cuts, and spending-growth debates; changes to

      Medicaid pharmacy, nursing-home, or disease-management programs; Medicaid leadership and hearings; and

      advocacy or press about reforming Medicaid.'
    negative_desc: 'The email does not concern changing the Medicaid program. Individual eligibility or claims, routine provider

      payments with no policy change, and other health programs (Medicare, KidCare, general health care) with no

      Medicaid-reform angle are not responsive.'
    literal: Does this email concern efforts to reform Medicaid?
  gw_bush:
    title: George W. Weston
    rfp_text: All documents concerning George W. Weston, whether by explicit reference or by his relationship to Governor
      Weston.
    positive_desc: 'The email concerns George W. Weston, the President (2001-2009), Texas governor, and presidential candidate,
      and

      Governor Cal Weston''s brother: references to him by name or as "the President" or "your brother"; his

      campaigns, administration, appointments, or policies; White House or federal dealings with Florida in which

      he figures; requests that the Governor pass something on to him; and Weston family matters that involve him.'
    negative_desc: 'The email does not concern George W. Weston. Emails addressed to or about Governor Cal Weston alone, complaints

      or praise directed at the Governor, other Weston family members, and federal agencies or matters with no

      reference to the President are not responsive, even though they mention "Weston".'
    literal: 'Does this email concern George W. Weston, either by explicit reference to him or through his relationship to

      Governor Cal Weston?'
  movie_gallery:
    title: Movie Gallery
    rfp_text: All documents concerning investments or divestments by the State of Florida in Movie Gallery.
    positive_desc: 'The email concerns the State of Florida (its pension fund, the State Board of Administration, or any other

      state investment vehicle) investing in, holding, or divesting from Movie Gallery, the video rental company,

      including criticism of or explanations for the state''s Movie Gallery position.'
    negative_desc: 'The email does not concern Florida''s investment in or divestment from Movie Gallery. Other state investments,

      the film industry, movie rentals generally, and Movie Gallery as a business with no state-investment angle

      are not responsive.'
    literal: Does this email concern investments or divestments by the State of Florida in Movie Gallery?
  condominiums:
    title: Condominiums
    rfp_text: 'All documents concerning the rules and organizations governing Florida condominium associations and

      conflicts between owners and managers in Florida. Relevant documents include those concerning the

      establishment of the Florida office of ombudsman, and issues relating to hiring and firing the ombudsman.'
    positive_desc: 'The email concerns Florida condominium and community associations: the statutes, rules, and agencies that

      govern condominium and homeowners'' associations; disputes between unit owners and association boards or

      managers; association-reform legislation and requests to sign or veto it; consumer advocacy about

      associations (for example Cyber Citizens for Justice); and the Florida condominium ombudsman, including

      creating the office and appointing, hiring, or firing the ombudsman.'
    negative_desc: 'The email does not concern condominium or homeowners'' association governance, owner-manager conflicts,
      or

      the ombudsman. Real estate sales, housing supply, hurricane insurance, and construction matters with no

      association-governance angle are not responsive.'
    literal: 'Does this email concern the rules and organizations governing Florida condominium associations, conflicts

      between condominium owners and managers in Florida, the establishment of the Florida condominium ombudsman

      office, or the hiring or firing of the ombudsman?'
  bottled_water:
    title: Bottled water
    rfp_text: All documents concerning the extraction of water in Florida for bottling by commercial enterprises.
    positive_desc: 'The email concerns commercial extraction of Florida water for bottling, or the protection of the springs
      and

      groundwater from which it is drawn: bottling companies and their withdrawals; water-use or consumptive-use

      permits for pumping spring or aquifer water; minimum flows and levels for springs; the Springs Initiative and

      Springs Task Force; opposition to pumping or bottling operations; and legislation, fees, or taxes on water

      extraction or bottled water.'
    negative_desc: 'The email does not concern water extraction for bottling or the protection of Florida''s springs and

      groundwater from withdrawal. Drinking-water quality, drought and water supply for cities, Everglades

      restoration, coastal or surface-water pollution, and bottled water bought or distributed are not responsive.'
    literal: Does this email concern the extraction of water in Florida for bottling by commercial enterprises?
  marketing:
    title: Marketing
    rfp_text: 'All documents concerning advertising or marketing efforts undertaken by the Florida Governor''s office or any

      other institution of the State of Florida.'
    positive_desc: 'The email concerns efforts by the Governor''s office or any Florida state agency, board, university, or

      state-sponsored organization to advertise, market, or promote Florida, a state program, or the Governor''s

      message: advertising campaigns and public-service announcements; tourism promotion (Visit Florida, film

      commission); economic development, business recruitment, and trade promotion (Enterprise Florida, trade

      missions, meetings with foreign officials to promote Florida business); branding, slogans, and websites;

      the Governor''s public outreach such as webcasts, addresses, and communications campaigns; and the funding,

      contracts, or evaluation of such efforts.'
    negative_desc: 'The email does not concern state advertising, marketing, or promotion. Marketing by private companies,

      unsolicited marketing received by staff, political campaign advertising by non-state entities, and routine

      press inquiries or scheduling with no promotional effort are not responsive.'
    literal: 'Does this email concern advertising or marketing efforts undertaken by the Florida Governor''s office or any

      other institution of the State of Florida?'
  faith_based:
    title: Faith-based initiatives
    rfp_text: 'All documents concerning grants or other initiatives in Florida to offload social services to so-called

      faith-based agencies. Services include but are not limited to education, prisons, and emergency relief.'
    positive_desc: 'The email concerns Florida grants, programs, partnerships, legislation, boards, or other initiatives that

      have social services delivered by faith-based or religious organizations: education and schools, prisons

      and prisoner re-entry, emergency relief, welfare, youth and family services, mentoring, substance abuse,

      and similar services; the Governor''s faith-based and community initiatives; and churches, pastors, or

      religious charities as partners or providers of such services.'
    negative_desc: 'The email does not concern faith-based delivery of social services in Florida. Religious matters with
      no

      social-service program (prayers, greetings, church events), and social services delivered by secular or

      government agencies with no faith-based angle, are not responsive.'
    literal: 'Does this email concern grants or other initiatives in Florida to have social services (such as education,

      prisons, or emergency relief) provided by faith-based agencies?'
  nra_rifle:
    title: National Rifle Association (NRA)
    rfp_text: 'All documents concerning the National Rifle Association, its members, and its influences. Documents

      concerning the non-resident alien issue are not relevant.'
    positive_desc: 'The email concerns the National Rifle Association or the gun-rights agenda it advances in Florida: the

      organization, its officials, members, lobbying, endorsements, and mailings; firearms legislation and

      ordinances (concealed weapons, gun shows, background checks, firearms in workplaces or facilities) and

      constituents'' positions on them; gun-rights advocacy directed at the Governor; and firearms industry or

      manufacturer matters raised with the state.'
    negative_desc: 'The email does not concern the National Rifle Association or gun-rights matters. Emails in which "NRA"
      means

      non-resident alien (bank interest reporting, IRS rules, immigration) are not responsive, nor are hunting or

      wildlife matters with no firearms-policy angle, or law-enforcement matters with no gun-rights dimension.'
    literal: 'Does this email concern the National Rifle Association, its members, or its influence? Documents about the

      non-resident alien issue (also abbreviated NRA) are not responsive.'
  nra_aliens:
    title: Non-resident aliens (NRA)
    rfp_text: 'All documents involving discussions of the non-resident alien issue. Documents concerning the National

      Rifle Association are not relevant.'
    positive_desc: 'The email involves discussion of the non-resident alien (NRA) issue: chiefly the proposed IRS or Treasury

      regulation requiring U.S. banks to report interest paid on deposits held by non-resident aliens, the

      Florida Bankers Association''s and the Governor''s opposition to it, and letters to Treasury, the IRS, or

      Congress about it; and more generally the treatment of non-resident aliens under tax, banking, licensing,

      tuition, or benefits law.'
    negative_desc: 'The email does not discuss the non-resident alien issue. Emails in which "NRA" means the National Rifle

      Association, and immigration or visa matters that do not concern non-resident alien status under tax or

      similar law, are not responsive.'
    literal: 'Does this email involve discussion of the non-resident alien issue? Documents about the National Rifle

      Association (also abbreviated NRA) are not responsive.'
  a1_terri_schiavo:
    title: Terri Lindqvist
    rfp_text: All documents concerning Terri Lindqvist, the dispute over her care, and the actions of the Governor, the Legislature
      or the courts in her case.
    positive_desc: 'The email concerns Terri Lindqvist, the Florida woman in a persistent vegetative state whose husband and
      parents (Robert and Mary Hollis) fought in court over removing her feeding tube: the litigation, the Legislature''s
      "Terri''s Law" (2003) and the Governor''s intervention under it, the 2005 legislative and federal efforts, the Governor''s
      statements or decisions in the case, DCF''s involvement, and constituents writing to the Governor for or against keeping
      her alive or about the case. Right-to-die, end-of-life and guardianship discussion that is prompted by or refers to
      her case is responsive.'
    negative_desc: The email does not concern Terri Lindqvist or the dispute over her care. Other end-of-life, disability,
      health-care or guardianship matters with no reference to her case are not responsive.
