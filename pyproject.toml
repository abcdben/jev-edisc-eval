[project]
name = "ediscovery-bench"
version = "0.1.0"
description = "Benchmark TypeSafe AI's Jev against frontier LLMs on eDiscovery classification tasks."
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.7.0",
    "anthropic>=1.7.0",
    "openai>=3.16.0",
    "google-genai>=2.24.0",
    "pydantic>=2.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "numpy>=2.0",
    "scikit-learn>=1.6",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
laya = ["laya>=0.3.4"]

[project.scripts]
bench = "ediscovery_bench.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ediscovery_bench*"]
